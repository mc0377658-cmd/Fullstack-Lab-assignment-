<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Store</title><style>body{font:16px Arial;max-width:900px;margin:30px auto;padding:0 16px}.product{border:1px solid #ddd;padding:12px;margin:10px 0}input{margin:4px}</style></head><body><h1>Demo Store</h1><p><b>Checkout is simulated. No payment details are collected and no money is charged.</b></p><h2>Products</h2><div id="products"></div><h2>Cart</h2><ul id="cart"></ul><button id="checkout">Place demo order</button><p id="message"></p><h2>Seller panel — add product</h2><form id="seller"><input name="name" placeholder="Name" required><input name="price" type="number" min="0" step=".01" placeholder="Price" required><input name="description" placeholder="Description"><button>Add product</button></form><h2>Successful demo orders</h2><ul id="orders"></ul><script>
let cart=[];const productsEl=document.querySelector('#products'),cartEl=document.querySelector('#cart'),msg=document.querySelector('#message'),ordersEl=document.querySelector('#orders');
async function load(){const ps=await(await fetch('/api/products')).json();productsEl.replaceChildren();ps.forEach(p=>{const d=document.createElement('div');d.className='product';d.innerHTML=`<b>${p.name}</b> — ₹${p.price}<p>${p.description||''}</p>`;const add=document.createElement('button');add.textContent='Add to cart';add.onclick=()=>{cart.push(p.id);drawCart()};d.append(add);productsEl.append(d)});const os=await(await fetch('/api/orders')).json();ordersEl.innerHTML=os.map(o=>`<li>Order ${o.id}: ₹${o.total} (${o.status})</li>`).join('')}
function drawCart(){cartEl.innerHTML=cart.map((id,i)=>`<li>Product #${id} <button data-i="${i}">Remove</button></li>`).join('');cartEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.i,1);drawCart()})}
document.querySelector('#checkout').onclick=async()=>{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart})}),data=await r.json();msg.textContent=r.ok?`Order ${data.id} recorded as a demo order.`:data.error;if(r.ok)cart=[];drawCart();load()};
document.querySelector('#seller').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(r.ok){e.target.reset();load()}else msg.textContent='Could not add product'};
load();
</script></body></html>
